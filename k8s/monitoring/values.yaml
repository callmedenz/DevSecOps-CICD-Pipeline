# Custom values for kube-prometheus-stack
grafana:
  enabled: true
  adminPassword: "admin"
  service:
    type: NodePort
    nodePort: 32000

kubelet:
  enabled: true
  serviceMonitor:
    cAdvisor: true
    insecureSkipVerify: true

prometheus:
  enabled: true
  prometheusSpec:
    hostNetwork: true
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

alertmanager:
  enabled: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
